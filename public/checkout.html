<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Husna Artistry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<header class="navbar">
  <div class="navbar-inner">
    <a href="/index.html" class="brand">
      <img src="/assets/husna-logo.jpg" alt="Husna Artistry logo" class="brand-logo">
      <span class="brand-name">Husna Artistry</span>
    </a>
    <span class="checkout-steps">Cart &nbsp;›&nbsp; <strong>Checkout</strong> &nbsp;›&nbsp; Payment</span>
  </div>
</header>

<main class="checkout-page">
  <div class="checkout-grid">
    <form id="checkoutForm" class="checkout-form">
      <h2 class="section-title checkout-title">Delivery Address</h2>

      <div class="form-row">
        <label>Full Name
          <input type="text" name="fullName" required>
        </label>
        <label>Mobile Number
          <input type="tel" name="mobile" required pattern="[0-9]{10,15}" placeholder="10-digit mobile number">
        </label>
      </div>
      <label>Email (optional, for order updates)
        <input type="email" name="email">
      </label>
      <div class="form-row">
        <label>House / Flat No.
          <input type="text" name="houseNo" required>
        </label>
        <label>Street
          <input type="text" name="street" required>
        </label>
      </div>
      <div class="form-row">
        <label>Area
          <input type="text" name="area">
        </label>
        <label>Landmark
          <input type="text" name="landmark">
        </label>
      </div>
      <div class="form-row">
        <label>City
          <input type="text" name="city" required>
        </label>
        <label>State
          <input type="text" name="state" required>
        </label>
      </div>
      <div class="form-row">
        <label>PIN Code
          <input type="text" name="pincode" required pattern="[0-9]{4,10}">
        </label>
        <label>Address Type
          <select name="addressType">
            <option value="Home">Home</option>
            <option value="Work">Work</option>
          </select>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="payNowBtn">Pay Now</button>
      <p class="checkout-secure-note">🔒 Payments are securely processed by Razorpay. We never see or store your card details.</p>
    </form>

    <aside class="order-summary">
      <h3>Order Summary</h3>
      <div id="summaryItems" class="summary-items"></div>
      <div class="summary-row">
        <span>Items Total</span>
        <span id="summaryItemsTotal">₹0</span>
      </div>
      <div class="summary-row">
        <span>Delivery Charges</span>
        <span id="summaryDelivery">Free</span>
      </div>
      <div class="summary-row summary-total">
        <span>Total Amount</span>
        <span id="summaryTotal">₹0</span>
      </div>
    </aside>
  </div>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="api.js"></script>
<script src="checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="motion.js"></script>
</body>
</html>
